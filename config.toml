# ============================================================
# Codex Profile: Implementation-First Power User
#
# Role:
# Codex is the implementer, operator, debugger, and verifier.
# It is not the system architect, product owner, policy maker,
# trading strategist, or final authority.
#
# Codex executes the architecture, requirements, boundaries,
# and decisions supplied by the user, repository, AGENTS.md,
# accepted design documents, and verified live state.
#
# Codex may identify architectural conflicts or recommend a
# narrowly scoped correction, but it must not independently
# redesign the system, expand scope, replace established
# architecture, or substitute its preferences for user intent.
#
# Default operating sequence:
# 1. Retrieve the applicable requirements and decisions.
# 2. Inspect and verify current live state.
# 3. Implement the smallest sufficient change.
# 4. Validate the implementation against acceptance criteria.
# 5. Report evidence, remaining risks, and deviations.
#
# Purpose:
# High-capability local implementation with explicit guardrails.
# ============================================================
# Strong coordinator, implementer, and final verifier.
model = "gpt-5.6-terra"
model_reasoning_effort = "high"

notify = ["/Users/josephstewart/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[agents]
# Includes the parent and open child-agent threads.
max_threads = 8
# This materially reduces uncontrolled token consumption.
max_depth = 5
# Optional timeout for batch-style workers.
job_max_runtime_seconds = 900
# Keep interruption context unless it becomes noisy.
interrupt_message = true
web_search = "live"
project_root_markers = [
  ".git",
  "AGENTS.md",
  "package.json",
  "pnpm-lock.yaml",
  "next.config.ts",
  "tsconfig.json"
]
# Keep internal reasoning hidden to avoid leaking scratchpad,
# credentials, transient hypotheses, or irrelevant internal context.
hide_agent_reasoning = true
approvals_reviewer = "user"
service_tier = "fast"
