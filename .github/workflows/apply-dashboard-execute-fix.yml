name: Apply dashboard execute fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-dashboard-execute-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove stale client-side execute gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/dashboard/app/components/ActionPanel.tsx')
          text = path.read_text()
          old = '''          const actionDisabled =
            readOnly ||
            busy !== null ||
            (action.requiresReviewedPayloads === true && !executeReady);'''
          new = '''          const actionDisabled = readOnly || busy !== null;'''
          if old not in text:
              raise SystemExit('Expected stale actionDisabled gate was not found')
          text = text.replace(old, new, 1)

          old_title = '''                title={
                  action.requiresReviewedPayloads && !executeReady
                    ? "Run Review Paper Order Payloads first; no fresh eligible reviewed payload is available."
                    : undefined
                }'''
          new_title = '''                title={
                  action.requiresReviewedPayloads
                    ? "The VPS validates the latest persisted reviewed payload when this action runs."
                    : undefined
                }'''
          if old_title not in text:
              raise SystemExit('Expected stale execute title was not found')
          text = text.replace(old_title, new_title, 1)
          path.write_text(text)
          PY
      - name: Commit dashboard correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/app/components/ActionPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix dashboard paper execution button gate"
          git push origin main
