name: Fix dashboard execute button v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-dashboard-execute-button-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove stale client-side execution gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/dashboard/app/components/ActionPanel.tsx')
          text = path.read_text()

          updated, disabled_count = re.subn(
              r'''          const actionDisabled =\n            readOnly \|\|\n            busy !== null \|\|\n            \(action\.requiresReviewedPayloads === true && !executeReady\);''',
              '          const actionDisabled = readOnly || busy !== null;',
              text,
              count=1,
          )
          if disabled_count != 1:
              raise SystemExit(f'Expected one stale actionDisabled gate, found {disabled_count}')

          updated, title_count = re.subn(
              r'''                title=\{\n                  action\.requiresReviewedPayloads && !executeReady\n                    \? "Run Review Paper Order Payloads first; no fresh eligible reviewed payload is available\."\n                    : undefined\n                \}''',
              '''                title={
                  action.requiresReviewedPayloads
                    ? "The VPS validates the latest persisted reviewed payload when this action runs."
                    : undefined
                }''',
              updated,
              count=1,
          )
          if title_count != 1:
              raise SystemExit(f'Expected one stale execute title, found {title_count}')

          path.write_text(updated)
          PY

      - name: Commit correction
        run: |
          rm -f .github/workflows/fix-dashboard-execute-button.yml
          rm -f .github/workflows/fix-dashboard-execute-button-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/app/components/ActionPanel.tsx .github/workflows/fix-dashboard-execute-button.yml .github/workflows/fix-dashboard-execute-button-v2.yml
          git commit -m "Fix dashboard paper execution button gate"
          git push origin main
